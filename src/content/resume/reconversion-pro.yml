description: >-
  Professionnel avec plus de 15 ans d'expérience, habitué à mevner des projets
  de bout en bout, à travailler avec méthode et à rechercher des solutions
  concrètes. Issu du développement numérique et formé au design graphique, je souhaite
  aujourd'hui me reconvertir vers un nouveau métier, en apprendre les méthodes,
  et en acquérir progressivement les compétences propres.

skills:
