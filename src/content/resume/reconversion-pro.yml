        - Planification et gestion des priorités
        - Respect des délais et des objectifs
        - Structuration et amélioration des méthodes de travail

    - title: Rigueur et qualité
      items:
        - Attention aux détails et contrôle des résultats
        - Respect des exigences et recherche d'amélioration
        - Résolution durable des problèmes

    - title: Autonomie et initiative
      items:
        - Gestion de projets de bout en bout
        - Prise de responsabilités et résolution de problèmes
        - Capacité à travailler de manière autonome

    - title: Communication et collaboration
      items:
        - Écoute et compréhension des besoins
        - Travail avec des interlocuteurs variés
        - Transmission des connaissances et accompagnement

    - title: Adaptabilité et apprentissage
      items:
        - Adaptation à différents environnements de travail
        - Capacité à transformer un besoin en réalisation concrète
        - Volonté d'acquérir de nouvelles compétences professionnelles

    - title: Langues
      items:
        - Français (langue maternelle)
        - Allemand (C1)
        - Anglais (niveau professionnel)

